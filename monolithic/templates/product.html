{% extends "base.html" %}{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('index') }}">← Back to products</a></p>
<div class="detail">
  <div class="icon">{{ product.icon }}</div>
  <div>
    <div class="cat">{{ product.category }}</div>
    <h1>{{ product.name }}</h1>
    <p class="price" style="font-size:1.6rem">₹{{ '%.0f'|format(product.price) }}</p>
    <p>{{ product.description }}</p>
    <form method="post" action="{{ url_for('add_to_cart', pid=product.id) }}">
      <label>Quantity</label><input class="qty" type="number" name="quantity" value="1" min="1">
      <p><button>Add to cart</button></p>
    </form>
  </div>
</div>
{% endblock %}
