# Optional: run every service in its own container with `docker compose up`
x-python-service: &python-service
  image: python:3.12-slim
  working_dir: /app
  command: sh -c "pip install -q -r requirements.txt && python app.py"

services:
  product-service:
    <<: *python-service
    volumes: ["./product-service:/app"]
    environment: { PORT: "5001" }
    ports: ["5001:5001"]

  cart-service:
    <<: *python-service
    volumes: ["./cart-service:/app"]
    environment: { PORT: "5002", PRODUCT_SERVICE_URL: "http://product-service:5001" }
    ports: ["5002:5002"]
    depends_on: [product-service]

  payment-service:
    <<: *python-service
    volumes: ["./payment-service:/app"]
    environment: { PORT: "5004" }
    ports: ["5004:5004"]

  order-service:
    <<: *python-service
    volumes: ["./order-service:/app"]
    environment:
      PORT: "5003"
      CART_SERVICE_URL: "http://cart-service:5002"
      PAYMENT_SERVICE_URL: "http://payment-service:5004"
    ports: ["5003:5003"]
    depends_on: [cart-service, payment-service]

  frontend:
    <<: *python-service
    volumes: ["./frontend:/app"]
    environment:
      PORT: "5000"
      PRODUCT_SERVICE_URL: "http://product-service:5001"
      CART_SERVICE_URL: "http://cart-service:5002"
      ORDER_SERVICE_URL: "http://order-service:5003"
      PAYMENT_SERVICE_URL: "http://payment-service:5004"
    ports: ["5000:5000"]
    depends_on: [product-service, cart-service, order-service, payment-service]
